<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 强制锁定桌面视口，永远保持高级横排比例，手机打开也绝不压缩 -->
    <meta name="viewport" content="width=1280">
    <title>个人作品集 - The Personal Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg-color: #F4F3ED; }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; position: fixed;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color 0.8s ease;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .hero-title { font-family: 'Playfair Display', serif; line-height: 0.85; letter-spacing: -0.02em; }
        .spine-text-en { writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: 0.15em; font-family: 'Playfair Display', serif; }
        .spine-text-zh { writing-mode: vertical-rl; text-orientation: upright; font-family: 'Noto Serif SC', serif; letter-spacing: 0.25em; }
        .spine-text-sans { writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: 0.15em; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .view-section {
            position: absolute; inset: 0; width: 100vw; height: 100vh;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        #shelf-header { height: 28vh; } 
        
        .shelf-container {
            width: 100%; height: 72vh; 
            overflow-x: auto; overflow-y: visible; 
            scroll-behavior: smooth;
        }

        .perspective-scene {
            perspective: 2500px; 
            perspective-origin: 50% -20%; 
            display: flex; 
            justify-content: center; 
            align-items: flex-end; 
            padding: 0 5vw 8vh 5vw; 
            gap: 2vw; 
            width: max-content; min-width: 100%; height: 100%;
            transform: translateX(-3vw);
        }

        .book-3d {
            position: relative; width: var(--w); height: var(--h); transform-style: preserve-3d;
            transform: rotateY(-30deg) translateZ(0); transition: all 0.5s ease;
            cursor: pointer; flex-shrink: 0; box-shadow: -15px 25px 30px rgba(0,0,0,0.15);
        }
        .book-3d:hover { transform: rotateY(-10deg) translateZ(50px) translateY(-15px); }

        .face { position: absolute; top: 0; left: 0; backface-visibility: visible; }
        .face.front { width: var(--w); height: var(--h); background-color: var(--bg); transform: translateZ(0); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 2vh 0; color: var(--text-color); border-radius: 2px 0 0 2px;}
        .face.right { width: var(--d); height: var(--h); background-color: var(--side-bg); transform-origin: left; transform: translateX(var(--w)) rotateY(90deg); border-left: 2px solid rgba(0,0,0,0.2); overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .face.top { width: var(--w); height: var(--d); background-color: #E8E6DF; transform-origin: top; transform: rotateX(-90deg); background-image: repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px); }
        .cover-decor { font-family: 'Playfair Display', serif; font-size: 5rem; color: rgba(255,255,255,0.04); writing-mode: vertical-rl; white-space: nowrap; font-weight: 900; }

        .tex-linen::after, .tex-noise::after, .tex-kraft::after, .tex-matte::after { content:''; position:absolute; inset:0; pointer-events:none; }
        .tex-linen::after { background-image: repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(255,255,255,0.03) 2px, rgba(255,255,255,0.03) 4px); }
        .tex-matte::after { background-image: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.08) 0%, transparent 60%); }

        .detail-wrapper { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; }
        .book-area { width: 45vw; height: 100%; display: flex; justify-content: center; align-items: center; transition: all 0.6s ease; }
        .text-area { width: 40vw; transition: all 0.4s ease; opacity: 1; padding-right: 10vw; }
        
        #detail-view.is-open .text-area { width: 0; opacity: 0; padding-right: 0; pointer-events: none; }
        #detail-view.is-open .book-area { width: 100vw; } 
        #detail-view.is-open .flip-book { transform: translateX(0) rotateY(0deg) rotateX(0deg) scale(1.15); }

        .flip-perspective { perspective: 3500px; display: flex; justify-content: center; align-items: center; }
        .flip-book { position: relative; transform-style: preserve-3d; transform: translateX(0) rotateY(-15deg) rotateX(2deg); transition: transform 0.6s ease; cursor: pointer; }
        
        #view-scroll { overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; }
        
        .hero-overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 10; }
        .hero-bg-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .hero-content { position: relative; z-index: 20; color: #ffffff; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <!-- ================= 0. 完美防黑屏加载保护罩 ================= -->
    <div id="global-loader" class="fixed inset-0 bg-[#F4F3ED] z-[99999] flex flex-col items-center justify-center transition-opacity duration-700">
        <div class="w-12 h-12 border-4 border-gray-200 border-t-gray-800 rounded-full animate-spin mb-4"></div>
        <div class="text-xs tracking-[0.3em] font-serif text-gray-500 uppercase">Preparing the Experience...</div>
    </div>

    <!-- ================= 1. 绝美粒子信封开场页 ================= -->
    <div id="intro-view" class="fixed inset-0 w-full h-full z-[9999] flex items-center justify-center overflow-hidden transition-all duration-1000 bg-[#1A1A1A]">
        <!-- 动态粒子背景层，完全使用了你的原图 -->
        <img src="570117c7dbba77a53b65b8e312be68a4.jpg" class="absolute inset-0 w-full h-full object-cover opacity-80" alt="Sea Background">
        <canvas id="particle-canvas" class="absolute inset-0 pointer-events-none z-10"></canvas>
        
        <!-- 居中信封层 -->
        <div class="relative z-20 cursor-pointer transform hover:scale-105 transition-transform duration-500 flex flex-col items-center justify-center" onclick="enterSite()">
            <!-- 信封主体 -->
            <div class="relative w-[450px] h-[300px] bg-[#FDFCF8] shadow-2xl flex flex-col items-center justify-center border border-gray-200 overflow-hidden rounded-sm">
                <!-- 信封四角的阴影封皮 -->
                <div class="absolute top-0 left-0 w-0 h-0 border-solid border-t-[150px] border-l-[225px] border-r-[225px] border-b-0 border-transparent border-t-gray-300 opacity-40 z-20 pointer-events-none"></div>
                <div class="absolute bottom-0 left-0 w-0 h-0 border-solid border-b-[150px] border-l-[225px] border-r-[225px] border-t-0 border-transparent border-b-gray-100 z-10 pointer-events-none"></div>
                <div class="absolute top-0 left-0 w-0 h-0 border-solid border-l-[225px] border-t-[150px] border-b-[150px] border-r-0 border-transparent border-l-gray-50 z-15 pointer-events-none"></div>
                <div class="absolute top-0 right-0 w-0 h-0 border-solid border-r-[225px] border-t-[150px] border-b-[150px] border-l-0 border-transparent border-r-gray-50 z-15 pointer-events-none"></div>
                
                <!-- 文字与按钮 -->
                <div class="z-30 text-center flex flex-col items-center justify-center h-full w-full bg-white/30 backdrop-blur-[2px]">
                    <h1 class="text-7xl font-serif text-[#1A1A1A] mb-8" style="font-family: 'Playfair Display', serif; font-style: italic;">Hello</h1>
                    <div class="text-xs font-sans tracking-[0.3em] uppercase border border-gray-600 text-gray-800 px-8 py-3 hover:bg-gray-800 hover:text-white transition-colors duration-300">Click to Open</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= 2. 首页书架 ================= -->
    <div id="view-shelf" class="view-section flex flex-col justify-between" style="opacity: 1; z-index: 10; pointer-events: auto; transform: scale(1);">
        <header id="shelf-header" class="w-full flex flex-col items-center justify-center shrink-0 z-10 pointer-events-none">
            <p class="text-xs tracking-[0.4em] text-gray-500 mb-4 font-serif uppercase mt-8">Chapter 1</p>
            <h1 class="hero-title text-[7rem] font-black text-center text-[#1A1A1A]">
                WELCOME TO<br>MY SPACE
            </h1>
        </header>

        <div class="shelf-container">
            <div class="perspective-scene">
                <!-- 纯净的点击事件，秒开内容 -->
                <div onclick="openDetailView(0)" class="book-3d shadow-xl" style="--w: 7vw; --h: 60vh; --d: 25vw; --bg: #2B3A4A; --side-bg: #1F2A36; --text-color: #FFFFFF;">
                    <div class="face front tex-linen"><span class="absolute top-6 text-xs opacity-50 font-serif">VOL.01</span><span class="spine-text-sans text-4xl uppercase font-black">ABOUT ME</span></div>
                    <div class="face right tex-linen"><span class="cover-decor text-white/10">ABOUT</span></div><div class="face top"></div>
                </div>

                <div onclick="openDetailView(1)" class="book-3d shadow-2xl" style="--w: 6.5vw; --h: 46vh; --d: 24vw; --bg: #8B3A3A; --side-bg: #6B2C2C; --text-color: #F7F6F2;">
                    <div class="face front tex-noise"><span class="absolute top-6 text-xs opacity-50 font-serif">VOL.02</span><span class="spine-text-zh text-2xl font-bold">排版设计</span></div>
                    <div class="face right tex-noise"><span class="cover-decor text-white/10">TYPO</span></div><div class="face top"></div>
                </div>

                <div onclick="openDetailView(2)" class="book-3d shadow-2xl" style="--w: 8vw; --h: 53vh; --d: 26vw; --bg: #1A1A1A; --side-bg: #111111; --text-color: #F7F6F2;">
                    <div class="face front tex-matte"><span class="absolute top-6 text-sm opacity-60 font-serif">VOL.03</span><span class="spine-text-zh text-3xl font-black">品牌包装设计</span></div>
                    <div class="face right tex-matte"><span class="cover-decor text-white/5">BRAND</span></div><div class="face top"></div>
                </div>

                <div onclick="openDetailView(3)" class="book-3d shadow-xl" style="--w: 6vw; --h: 41vh; --d: 23vw; --bg: #D48E45; --side-bg: #B07435; --text-color: #1A1A1A;">
                    <div class="face front tex-kraft"><span class="absolute top-6 text-xs opacity-60 font-serif">VOL.04</span><span class="spine-text-zh text-2xl font-bold">文创设计</span></div>
                    <div class="face right tex-kraft"><span class="cover-decor text-black/10">CRAFT</span></div><div class="face top"></div>
                </div>
                
                <div onclick="openDetailView(4)" class="book-3d shadow-xl" style="--w: 5vw; --h: 48vh; --d: 21vw; --bg: #C19A5C; --side-bg: #A37F46; --text-color: #FFFFFF;">
                    <div class="face front tex-linen"><span class="absolute top-6 text-xs opacity-60 font-serif">VOL.05</span><span class="spine-text-zh text-xl font-bold">IP形象设计</span></div>
                    <div class="face right tex-linen"><span class="cover-decor text-black/10">CHARA</span></div><div class="face top"></div>
                </div>
                
                <div onclick="openDetailView(5)" class="book-3d shadow-md" style="--w: 6.5vw; --h: 38vh; --d: 23vw; --bg: #739E9E; --side-bg: #5A7D7D; --text-color: #FFFFFF;">
                    <div class="face front tex-noise"><span class="absolute top-6 text-xs opacity-60 font-serif">VOL.06</span><span class="spine-text-zh text-2xl font-bold">短视频创作</span></div>
                    <div class="face right tex-noise"><span class="cover-decor text-white/10">MOTION</span></div><div class="face top"></div>
                </div>

                <div onclick="openDetailView(6)" class="book-3d shadow-md" style="--w: 6.5vw; --h: 55vh; --d: 24vw; --bg: #828587; --side-bg: #686A6C; --text-color: #F7F6F2;">
                    <div class="face front tex-matte"><span class="absolute top-6 text-xs opacity-50 font-serif">VOL.07</span><span class="spine-text-zh text-3xl font-bold">电商美工</span></div>
                    <div class="face right tex-matte"><span class="cover-decor text-white/10">STORE</span></div><div class="face top"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. 中间前导页 -->
    <div id="detail-view" class="view-section flex text-white" style="opacity: 0; z-index: -1; pointer-events: none; transform: scale(0.96);">
        <button onclick="handleBackToShelf(event)" class="absolute top-10 left-12 text-xs tracking-widest font-serif uppercase flex items-center gap-2 hover:opacity-50 transition-opacity z-50 border-b border-white/30 pb-1">
            ← Back
        </button>

        <div class="detail-wrapper">
            <div class="book-area">
                <div class="flip-perspective">
                    <div class="flip-book" id="active-cover" onclick="openScrollContent(event)">
                        <!-- 动态注入 -->
                    </div>
                </div>
            </div>

            <div class="text-area font-serif flex flex-col justify-center">
                <div class="text-xs tracking-widest uppercase opacity-50 mb-8 border-b border-white/20 pb-4 flex justify-between">
                    <span>Selected Collection</span>
                    <span id="detail-vol">VOL.03</span>
                </div>
                <h1 class="text-6xl font-black mb-6 leading-tight" id="detail-title">标题</h1>
                <h2 class="text-xl italic mb-10 opacity-80" id="detail-subtitle">副标题</h2>
                <p class="text-base leading-relaxed opacity-70 mb-12 max-w-md text-gray-300" id="detail-summary">内容摘要</p>
                <div class="border border-white/30 py-4 px-6 uppercase text-xs tracking-widest cursor-pointer hover:bg-white/10 transition-colors max-w-sm flex justify-between items-center" onclick="openScrollContent(event)">
                    <span>Click Book to Open</span>
                    <span class="text-lg">📖</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 4. 长图流阅览页 -->
    <div id="view-scroll" class="view-section bg-transparent text-white hide-scrollbar" style="opacity: 0; z-index: -1; pointer-events: none; transform: scale(0.96);">
        <div class="sticky top-0 z-[100] w-full h-0">
            <button id="scroll-back-btn" onclick="handleBackToDetail(event)" class="absolute top-10 left-12 text-xs tracking-widest font-serif uppercase flex items-center gap-2 hover:opacity-50 transition-all border-b border-white/30 pb-1 bg-black/40 p-2 rounded backdrop-blur-sm shadow-lg text-white">
                ← Back
            </button>
        </div>

        <div class="w-full flex flex-col items-center">
            <div id="scroll-pages-container" class="w-full flex flex-col items-center w-full pb-20">
                <!-- 内容动态注入 -->
            </div>
        </div>
    </div>

    <!-- 核心逻辑 -->
    <script>
        // ================= 粒子背景特效代码 =================
        function initParticles() {
            const canvas = document.getElementById('particle-canvas');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const particles = [];
            for(let i=0; i<100; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 2 + 1,
                    dx: (Math.random() - 0.5) * 0.8,
                    dy: (Math.random() - 0.5) * 0.8
                });
            }
            function animate() {
                requestAnimationFrame(animate);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                particles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                    p.x += p.dx;
                    p.y -= p.dy; // 缓慢上升的效果
                    if(p.x < 0 || p.x > canvas.width) p.dx *= -1;
                    if(p.y < 0) p.y = canvas.height;
                    if(p.y > canvas.height) p.y = 0;
                });
            }
            animate();
        }
        
        // ================= 完美的防黑屏与初始化逻辑 =================
        window.addEventListener('load', () => {
            initParticles();
            const loader = document.getElementById('global-loader');
            loader.style.opacity = '0';
            setTimeout(() => { loader.style.display = 'none'; }, 700);
        });

        // 揭开信封进入网站
        function enterSite() {
            const intro = document.getElementById('intro-view');
            intro.style.opacity = '0';
            intro.style.transform = 'scale(1.1)';
            setTimeout(() => { intro.style.display = 'none'; }, 1000);
        }

        const bookData = [
            { vol: "VOL.01", title: "About Me", sub: "个人简介", desc: "你好，我是蒲慧玟。我相信优秀的设计与运营不仅仅是视觉的点缀，更是信息逻辑的重构与传播维度的拓展。", themeColor: "#1B242C", coverColor: "#2B3A4A", texClass: "tex-linen", short: "ABOUT", bgImg: "", cw: "28vw", ch: "76vh" },
            { vol: "VOL.02", title: "排版设计", sub: "中英文字体排印与网格系统", desc: "探讨汉字在现代网格系统中的表现张力，构建理性的视觉秩序。", themeColor: "#3B1B1B", coverColor: "#8B3A3A", texClass: "tex-noise", short: "TYPO", bgImg: "bg2.jpg", cw: "24vw", ch: "50vh" },
            { vol: "VOL.03", title: "品牌包装设计", sub: "克制与高级感的视觉传达", desc: "摒弃繁冗陈旧的视觉堆砌，尝试在极简的奶油白与深沉暗色系之间寻找平衡。", themeColor: "#3D3833", coverColor: "#1A1A1A", texClass: "tex-matte", short: "BRAND", bgImg: "bg3.jpg", cw: "26vw", ch: "58vh" },
            { vol: "VOL.04", title: "文创设计", sub: "非遗文化与地质美学的现代转化", desc: "挖掘地域性的工业遗产与非遗文化，重构为符合现代审美的产品体验。", themeColor: "#4A321E", coverColor: "#D48E45", texClass: "tex-kraft", short: "CRAFT", bgImg: "bg4.jpg", cw: "23vw", ch: "45vh" },
            { vol: "VOL.05", title: "IP形象设计", sub: "角色设定与视觉延展", desc: "IP不仅仅是一个吉祥物，更是品牌性格的具象化表达。", themeColor: "#4A3A22", coverColor: "#C19A5C", texClass: "tex-linen", short: "CHARA", bgImg: "bg5.jpg", cw: "21vw", ch: "52vh" },
            { vol: "VOL.06", title: "短视频创作", sub: "动态视觉与叙事节奏", desc: "通过镜头语言与剪辑节奏，让静态的品牌视觉动起来，传递更丰富的情绪价值与沉浸感。", themeColor: "#2F4242", coverColor: "#739E9E", texClass: "tex-noise", short: "MOTION", bgImg: "bg6.jpg", cw: "23vw", ch: "42vh" },
            { vol: "VOL.07", title: "电商美工", sub: "AIGC 驱动的商品视觉重塑", desc: "结合前沿的生成式 AI 工具，探索高效率、高品质的电商场景渲染，重塑商品的视觉表现力。", themeColor: "#323334", coverColor: "#828587", texClass: "tex-matte", short: "STORE", bgImg: "bg7.jpg", cw: "24vw", ch: "60vh" }
        ];

        let currentIndex = 0;

        function setViewState(viewId) {
            const views = ['view-shelf', 'detail-view', 'view-scroll'];
            views.forEach(id => {
                const el = document.getElementById(id);
                if (id === viewId) {
                    el.style.opacity = '1';
                    el.style.pointerEvents = 'auto';
                    el.style.zIndex = '10';
                    el.style.transform = 'scale(1)';
                } else {
                    el.style.opacity = '0';
                    el.style.pointerEvents = 'none';
                    el.style.zIndex = '-1';
                    el.style.transform = 'scale(0.96)';
                }
            });
        }

        function openDetailView(index) {
            currentIndex = index;
            const data = bookData[index];
            
            document.getElementById('detail-vol').innerText = data.vol;
            document.getElementById('detail-title').innerText = data.title;
            document.getElementById('detail-subtitle').innerText = data.sub;
            document.getElementById('detail-summary').innerText = data.desc;
            
            const activeCover = document.getElementById('active-cover');
            activeCover.style.width = data.cw;
            activeCover.style.height = data.ch;
            activeCover.innerHTML = `
                <div class="${data.texClass} w-full h-full relative overflow-hidden" style="background-color: ${data.coverColor}; border-radius: 2px 6px 6px 2px; box-shadow: 15px 15px 30px rgba(0,0,0,0.3);">
                    <div class="absolute inset-0 flex flex-col justify-center items-center">
                        <div class="cover-big-title text-center w-full">${data.short}</div>
                        <div class="absolute bottom-6 right-6 text-white/70 text-xs tracking-widest uppercase font-serif animate-pulse">Click to Read →</div>
                    </div>
                </div>
            `;
            
            document.documentElement.style.setProperty('--bg-color', data.themeColor);
            
            setViewState('detail-view');
            document.getElementById('detail-view').classList.remove('is-open');
        }

        function generateHeroSection(data) {
            return `
                <div class="w-full min-h-[85vh] bg-[#0D0D0D] flex items-center justify-center relative overflow-hidden px-8">
                    <!-- lazy让大图丝滑加载不阻挡 -->
                    <img loading="lazy" src="${data.bgImg}" class="absolute inset-0 w-full h-full object-cover opacity-60">
                    <div class="relative z-20 max-w-4xl w-full flex flex-col items-center text-center">
                        <h1 class="text-7xl font-serif font-black mb-4 tracking-wider">${data.title}</h1>
                        <p class="text-sm text-gray-300 tracking-[0.3em] uppercase mb-8 opacity-80">${data.short} PROJECT</p>
                        <p class="text-xl font-bold mb-6 tracking-wider opacity-90">${data.sub}</p>
                        <p class="text-base text-gray-300 leading-loose max-w-2xl opacity-80">${data.desc}</p>
                    </div>
