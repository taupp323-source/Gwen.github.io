<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人作品集 - The Personal Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg-color: #F4F3ED; }

        /* 锁死底层页面，彻底杜绝全局滚动 */
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; position: fixed;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .hero-title { font-family: 'Playfair Display', serif; line-height: 0.85; letter-spacing: -0.02em; }
        .spine-text-en { writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: 0.15em; font-family: 'Playfair Display', serif; }
        .spine-text-zh { writing-mode: vertical-rl; text-orientation: upright; font-family: 'Noto Serif SC', serif; letter-spacing: 0.25em; }
        .spine-text-sans { writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: 0.15em; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ================= 视图底层框架 ================= */
        .view-section {
            position: absolute; inset: 0; width: 100vw; height: 100vh;
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .view-active { opacity: 1; pointer-events: auto; transform: scale(1); z-index: 10; }
        .view-hidden { opacity: 0; pointer-events: none; transform: scale(0.96); z-index: -1; }

        /* ================= 1. 首页 3D 书架 ================= */
        #shelf-header { height: 28vh; } 
        
        .shelf-container {
            width: 100%; height: 72vh; 
            overflow-x: auto; overflow-y: visible; 
            scroll-behavior: smooth;
        }

        .perspective-scene {
            perspective: 2500px; 
            perspective-origin: 50% -20%; 
            display: flex; 
            justify-content: center; 
            align-items: flex-end; 
            padding: 0 5vw 8vh 5vw; 
            gap: 2vw; 
            width: max-content; min-width: 100%; height: 100%;
            /* 居中视觉补偿 */
            transform: translateX(-3vw);
        }

        @media (max-width: 768px) {
            .perspective-scene { justify-content: flex-start; padding: 0 10vw 8vh 10vw; transform: translateX(0); }
        }

        .book-3d {
            position: relative; width: var(--w); height: var(--h); transform-style: preserve-3d;
            transform: rotateY(-30deg) translateZ(0); transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer; flex-shrink: 0; box-shadow: -15px 25px 30px rgba(0,0,0,0.15);
        }
        .book-3d:hover { transform: rotateY(-10deg) translateZ(50px) translateY(-15px); }

        .face { position: absolute; top: 0; left: 0; backface-visibility: visible; }
        .face.front { width: var(--w); height: var(--h); background-color: var(--bg); transform: translateZ(0); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 2vh 0; color: var(--text-color); border-radius: 2px 0 0 2px;}
        .face.right { width: var(--d); height: var(--h); background-color: var(--side-bg); transform-origin: left; transform: translateX(var(--w)) rotateY(90deg); border-left: 2px solid rgba(0,0,0,0.2); overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .face.top { width: var(--w); height: var(--d); background-color: #E8E6DF; transform-origin: top; transform: rotateX(-90deg); background-image: repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px); }
        .cover-decor { font-family: 'Playfair Display', serif; font-size: 5rem; color: rgba(255,255,255,0.04); writing-mode: vertical-rl; white-space: nowrap; font-weight: 900; }

        .tex-linen::after { content:''; position:absolute; inset:0; pointer-events:none; background-image: repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(255,255,255,0.03) 2px, rgba(255,255,255,0.03) 4px), repeating-linear-gradient(-45deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px); }
        .tex-noise::after { content:''; position:absolute; inset:0; pointer-events:none; background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.15"/></svg>'); mix-blend-mode: multiply; }
        .tex-kraft::after { content:''; position:absolute; inset:0; pointer-events:none; background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.12"/></svg>'), repeating-linear-gradient(0deg, transparent, transparent 10px, rgba(0,0,0,0.02) 10px, rgba(0,0,0,0.02) 12px); mix-blend-mode: color-burn;}
        .tex-matte::after { content:''; position:absolute; inset:0; pointer-events:none; background-image: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.08) 0%, transparent 60%); }

        /* ================= 2. 详情前导页引擎 ================= */
        .detail-wrapper { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; }
        .book-area { width: 45vw; height: 100%; display: flex; justify-content: center; align-items: center; transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1); }
        .text-area { width: 40vw; transition: all 0.5s ease; opacity: 1; padding-right: 10vw; }
        
        #detail-view.is-open .text-area { width: 0; opacity: 0; padding-right: 0; pointer-events: none; }
        #detail-view.is-open .book-area { width: 100vw; } 
        #detail-view.is-open .flip-book { transform: translateX(0) rotateY(0deg) rotateX(0deg) scale(1.15); }

        .flip-perspective { perspective: 3500px; display: flex; justify-content: center; align-items: center; }
        .flip-book { position: relative; transform-style: preserve-3d; transform: translateX(0) rotateY(-15deg) rotateX(2deg); transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1); cursor: pointer; }
        
        .click-hint { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        .cover-big-title { font-family: 'Playfair Display', serif; font-size: 8vw; color: rgba(255,255,255,0.2); text-transform: uppercase; font-weight
