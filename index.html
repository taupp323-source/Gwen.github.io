<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人作品集 - The Personal Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg-color: #F4F3ED; }

        /* 锁死底层页面，彻底杜绝全局滚动 */
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; position: fixed;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .hero-title { font-family: 'Playfair Display', serif; line-height: 0.85; letter-spacing: -0.02em; }
        .spine-text-en { writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: 0.15em; font-family: 'Playfair Display', serif; }
        .spine-text-zh { writing-mode: vertical-rl; text-orientation: upright; font-family: 'Noto Serif SC', serif; letter-spacing: 0.25em; }
        .spine-text-sans { writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: 0.15em; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ================= 视图底层框架 ================= */
        .view-section {
            position: absolute; inset: 0; width: 100vw; height: 100vh;
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .view-active { opacity: 1; pointer-events: auto; transform: scale(1); z-index: 10; }
        .view-hidden { opacity: 0; pointer-events: none; transform: scale(0.96); z-index: -1; }

        /* ================= 1. 首页 3D 书架 ================= */
        #shelf-header { height: 28vh; } 
        
        .shelf-container {
            width: 100%; height: 72vh; 
            overflow-x: auto; overflow-y: visible; 
            scroll-behavior: smooth;
        }

        .perspective-scene {
            perspective: 2500px; 
            perspective-origin: 50% -20%; 
            display: flex; 
            justify-content: center; 
            align-items: flex-end; 
            padding: 0 5vw 8vh 5vw; 
            gap: 2vw; 
            width: max-content; min-width: 100%; height: 100%;
            transform: translateX(-3vw);
        }

        @media (max-width: 768px) {
            .perspective-scene { justify-content: flex-start; padding: 0 10vw 8vh 10vw; transform: translateX(0); }
        }

        .book-3d {
            position: relative; width: var(--w); height: var(--h); transform-style: preserve-3d;
            transform: rotateY(-30deg) translateZ(0); transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer; flex-shrink: 0; box-shadow: -15px 25px 30px rgba(0,0,0,0.15);
        }
        .book-3d:hover { transform: rotateY(-10deg) translateZ(50px) translateY(-15px); }

        .face { position: absolute; top: 0; left: 0; backface-visibility: visible; }
        .face.front { width: var(--w); height: var(--h); background-color: var(--bg); transform: translateZ(0); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 2vh 0; color: var(--text-color); border-radius: 2px 0 0 2px;}
        .face.right { width: var(--d); height: var(--h); background-color: var(--side-bg); transform-origin: left; transform: translateX(var(--w)) rotateY(90deg); border-left: 2px solid rgba(0,0,0,0.2); overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .face.top { width: var(--w); height: var(--d); background-color: #E8E6DF; transform-origin: top; transform: rotateX(-90deg); background-image: repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px); }
        .cover-decor { font-family: 'Playfair Display', serif; font-size: 5rem; color: rgba(255,255,255,0.04); writing-mode: vertical-rl; white-space: nowrap; font-weight: 900; }

        .tex-linen::after { content:''; position:absolute; inset:0; pointer-events:none; background-image: repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(255,255,255,0.03) 2px, rgba(255,255,255,0.03) 4px), repeating-linear-gradient(-45deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px); }
        .tex-noise::after { content:''; position:absolute; inset:0; pointer-events:none; background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.15"/></svg>'); mix-blend-mode: multiply; }
        .tex-kraft::after { content:''; position:absolute; inset:0; pointer-events:none; background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.12"/></svg>'), repeating-linear-gradient(0deg, transparent, transparent 10px, rgba(0,0,0,0.02) 10px, rgba(0,0,0,0.02) 12px); mix-blend-mode: color-burn;}
        .tex-matte::after { content:''; position:absolute; inset:0; pointer-events:none; background-image: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.08) 0%, transparent 60%); }

        .detail-wrapper { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; }
        .book-area { width: 45vw; height: 100%; display: flex; justify-content: center; align-items: center; transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1); }
        .text-area { width: 40vw; transition: all 0.5s ease; opacity: 1; padding-right: 10vw; }
        
        #detail-view.is-open .text-area { width: 0; opacity: 0; padding-right: 0; pointer-events: none; }
        #detail-view.is-open .book-area { width: 100vw; } 
        #detail-view.is-open .flip-book { transform: translateX(0) rotateY(0deg) rotateX(0deg) scale(1.15); }

        .flip-perspective { perspective: 3500px; display: flex; justify-content: center; align-items: center; }
        .flip-book { position: relative; transform-style: preserve-3d; transform: translateX(0) rotateY(-15deg) rotateX(2deg); transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1); cursor: pointer; }
        
        .click-hint { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        .cover-big-title { font-family: 'Playfair Display', serif; font-size: 8vw; color: rgba(255,255,255,0.2); text-transform: uppercase; font-weight: 900; line-height: 0.9; pointer-events: none;}
        .handwritten-text { font-family: 'Noto Serif SC', serif; color: #334155; }

        #view-scroll { overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; }
        .animate-float { animation: float-photo 6s ease-in-out infinite; }
        @keyframes float-photo { 0% { transform: translateY(0px) rotate(-2deg); } 50% { transform: translateY(-12px) rotate(-1deg); } 100% { transform: translateY(0px) rotate(-2deg); } }

        /* 隐藏动效CSS，如果JS失效，图片会保持透明度0 */
        .reveal { opacity: 0; transform: translateY(40px); transition: opacity 0.8s ease-out, transform 0.8s cubic-bezier(0.25, 1, 0.5, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }
        .delay-100 { transition-delay: 100ms; }
        .delay-200 { transition-delay: 200ms; }
        .delay-300 { transition-delay: 300ms; }

        .hero-overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 10; }
        .hero-bg-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .hero-content { position: relative; z-index: 20; color: #ffffff; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="view-shelf" class="view-section view-active flex flex-col justify-between">
        <header id="shelf-header" class="w-full flex flex-col items-center justify-center shrink-0 z-10 pointer-events-none">
            <p class="text-xs tracking-[0.4em] text-gray-500 mb-4 font-serif uppercase mt-8">Chapter 1</p>
            <h1 class="hero-title text-6xl md:text-[7rem] font-black text-center text-[#1A1A1A]">
                WELCOME TO<br>MY SPACE
            </h1>
        </header>

        <div class="shelf-container">
            <div class="perspective-scene">
                <div onclick="openDetailView(0)" class="book-3d shadow-xl" style="--w: 7vw; --h: 60vh; --d: 25vw; --bg: #2B3A4A; --side-bg: #1F2A36; --text-color: #FFFFFF;">
                    <div class="face front tex-linen"><span class="absolute top-6 text-xs opacity-50 font-serif">VOL.01</span><span class="spine-text-sans text-4xl uppercase font-black">ABOUT ME</span></div>
                    <div class="face right tex-linen"><span class="cover-decor text-white/10">ABOUT</span></div><div class="face top"></div>
                </div>

                <div onclick="openDetailView(1)" class="book-3d shadow-2xl" style="--w: 6.5vw; --h: 46vh; --d: 24vw; --bg: #8B3A3A; --side-bg: #6B2C2C; --text-color: #F7F6F2;">
                    <div class="face front tex-noise"><span class="absolute top-6 text-xs opacity-50 font-serif">VOL.02</span><span class="spine-text-zh text-2xl font-bold">排版设计</span></div>
                    <div class="face right tex-noise"><span class="cover-decor text-white/10">TYPO</span></div><div class="face top"></div>
                </div>

                <div onclick="openDetailView(2)" class="book-3d shadow-2xl" style="--w: 8vw; --h: 53vh; --d: 26vw; --bg: #1A1A1A; --side-bg: #111111; --text-color: #F7F6F2;">
                    <div class="face front tex-matte"><span class="absolute top-6 text-sm opacity-60 font-serif">VOL.03</span><span class="spine-text-zh text-3xl font-black">品牌包装设计</span></div>
                    <div class="face right tex-matte"><span class="cover-decor text-white/5">BRAND</span></div><div class="face top"></div>
                </div>

                <div onclick="openDetailView(3)" class="book-3d shadow-xl" style="--w: 6vw; --h: 41vh; --d: 23vw; --bg: #D48E45; --side-bg: #B07435; --text-color: #1A1A1A;">
                    <div class="face front tex-kraft"><span class="absolute top-6 text-xs opacity-60 font-serif">VOL.04</span><span class="spine-text-zh text-2xl font-bold">文创设计</span></div>
                    <div class="face right tex-kraft"><span class="cover-decor text-black/10">CRAFT</span></div><div class="face top"></div>
                </div>
                
                <div onclick="openDetailView(4)" class="book-3d shadow-xl" style="--w: 5vw; --h: 48vh; --d: 21vw; --bg: #C19A5C; --side-bg: #A37F46; --text-color: #FFFFFF;">
                    <div class="face front tex-linen"><span class="absolute top-6 text-xs opacity-60 font-serif">VOL.05</span><span class="spine-text-zh text-xl font-bold">IP形象设计</span></div>
                    <div class="face right tex-linen"><span class="cover-decor text-black/10">CHARA</span></div><div class="face top"></div>
                </div>
                
                <div onclick="openDetailView(5)" class="book-3d shadow-md" style="--w: 6.5vw; --h: 38vh; --d: 23vw; --bg: #739E9E; --side-bg: #5A7D7D; --text-color: #FFFFFF;">
                    <div class="face front tex-noise"><span class="absolute top-6 text-xs opacity-60 font-serif">VOL.06</span><span class="spine-text-zh text-2xl font-bold">短视频创作</span></div>
                    <div class="face right tex-noise"><span class="cover-decor text-white/10">MOTION</span></div><div class="face top"></div>
                </div>

                <div onclick="openDetailView(6)" class="book-3d shadow-md" style="--w: 6.5vw; --h: 55vh; --d: 24vw; --bg: #828587; --side-bg: #686A6C; --text-color: #F7F6F2;">
                    <div class="face front tex-matte"><span class="absolute top-6 text-xs opacity-50 font-serif">VOL.07</span><span class="spine-text-zh text-3xl font-bold">电商美工</span></div>
                    <div class="face right tex-matte"><span class="cover-decor text-white/10">STORE</span></div><div class="face top"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="detail-view" class="view-section view-hidden text-white">
        <button onclick="handleBackToShelf()" class="absolute top-8 left-8 md:top-10 md:left-12 text-xs tracking-widest font-serif uppercase flex items-center gap-2 hover:opacity-50 transition-opacity z-50 border-b border-white/30 pb-1">
            ← Back
        </button>

        <div class="detail-wrapper">
            <div class="book-area">
                <div class="flip-perspective">
                    <div class="flip-book" id="active-cover" onclick="openScrollContent()">
                    </div>
                </div>
            </div>

            <div class="text-area font-serif flex flex-col justify-center">
                <div class="text-xs tracking-widest uppercase opacity-50 mb-8 border-b border-white/20 pb-4 flex justify-between">
                    <span>Selected Collection</span>
                    <span id="detail-vol">VOL.03</span>
                </div>
                <h1 class="text-5xl lg:text-6xl font-black mb-6 leading-tight" id="detail-title">标题</h1>
                <h2 class="text-xl italic mb-10 opacity-80" id="detail-subtitle">副标题</h2>
                <p class="text-sm md:text-base leading-relaxed opacity-70 mb-12 max-w-md text-gray-300" id="detail-summary">
                    内容摘要
                </p>
                <div class="border border-white/30 py-4 px-6 uppercase text-xs tracking-widest cursor-pointer hover:bg-white/10 transition-colors max-w-sm flex justify-between items-center" onclick="openScrollContent()">
                    <span>Click Book to Open</span>
                    <span class="text-lg">📖</span>
                </div>
            </div>
        </div>
    </div>

    <div id="view-scroll" class="view-section view-hidden bg-transparent text-white hide-scrollbar">
        <div class="sticky top-0 z-[100] w-full h-0">
            <button onclick="handleBackToDetail()" id="scroll-back-btn" class="absolute top-8 left-8 md:top-10 md:left-12 text-xs tracking-widest font-serif uppercase flex items-center gap-2 hover:opacity-50 transition-all border-b border-white/30 pb-1 bg-black/40 p-2 rounded backdrop-blur-sm shadow-lg text-white">
                ← Back
            </button>
        </div>

        <div class="w-full flex flex-col items-center">
            <div id="scroll-pages-container" class="w-full flex flex-col items-center w-full">
            </div>
        </div>
    </div>

    <script>
        const bookData = [
            { vol: "VOL.01", title: "About Me", sub: "个人简介", desc: "你好，我是蒲慧玟。我相信优秀的设计与运营不仅仅是视觉的点缀，更是信息逻辑的重构与传播维度的拓展。", themeColor: "#1B242C", coverColor: "#2B3A4A", texClass: "tex-linen", short: "ABOUT", bgImg: "", cw: "28vw", ch: "76vh" },
            { vol: "VOL.02", title: "排版设计", sub: "中英文字体排印与网格系统", desc: "探讨汉字在现代网格系统中的表现张力，构建理性的视觉秩序。", themeColor: "#3B1B1B", coverColor: "#8B3A3A", texClass: "tex-noise", short: "TYPO", bgImg: "bg2.jpg", cw: "24vw", ch: "50vh" },
            { vol: "VOL.03", title: "品牌包装设计", sub: "克制与高级感的视觉传达", desc: "摒弃繁冗陈旧的视觉堆砌，尝试在极简的奶油白与深沉暗色系之间寻找平衡。", themeColor: "#3D3833", coverColor: "#1A1A1A", texClass: "tex-matte", short: "BRAND", bgImg: "bg3.jpg", cw: "26vw", ch: "58vh" },
            { vol: "VOL.04", title: "文创设计", sub: "非遗文化与地质美学的现代转化", desc: "挖掘地域性的工业遗产与非遗文化，重构为符合现代审美的产品体验。", themeColor: "#4A321E", coverColor: "#D48E45", texClass: "tex-kraft", short: "CRAFT", bgImg: "bg4.jpg", cw: "23vw", ch: "45vh" },
            { vol: "VOL.05", title: "IP形象设计", sub: "角色设定与视觉延展", desc: "IP不仅仅是一个吉祥物，更是品牌性格的具象化表达。", themeColor: "#4A3A22", coverColor: "#C19A5C", texClass: "tex-linen", short: "CHARA", bgImg: "bg5.jpg", cw: "21vw", ch: "52vh" },
            { vol: "VOL.06", title: "短视频创作", sub: "动态视觉与叙事节奏", desc: "通过镜头语言与剪辑节奏，让静态的品牌视觉动起来，传递更丰富的情绪价值与沉浸感。", themeColor: "#2F4242", coverColor: "#739E9E", texClass: "tex-noise", short: "MOTION", bgImg: "bg6.jpg", cw: "23vw", ch: "42vh" },
            { vol: "VOL.07", title: "电商美工", sub: "AIGC 驱动的商品视觉重塑", desc: "结合前沿的生成式 AI 工具，探索高效率、高品质的电商场景渲染，重塑商品的视觉表现力。", themeColor: "#323334", coverColor: "#828587", texClass: "tex-matte", short: "STORE", bgImg: "bg7.jpg", cw: "24vw", ch: "60vh" }
        ];

        const viewShelf = document.getElementById('view-shelf');
        const viewDetail = document.getElementById('detail-view');
        const viewScroll = document.getElementById('view-scroll');
        const rootStyle = document.documentElement.style;
        const activeCover = document.getElementById('active-cover');
        const pageContainer = document.getElementById('scroll-pages-container');
        
        let currentIndex = 0;

        function openDetailView(index) {
            currentIndex = index;
            const data = bookData[index];
            
            document.getElementById('detail-vol').innerText = data.vol;
            document.getElementById('detail-title').innerText = data.title;
            document.getElementById('detail-subtitle').innerText = data.sub;
            document.getElementById('detail-summary').innerText = data.desc;
            
            activeCover.style.width = data.cw;
            activeCover.style.height = data.ch;
            activeCover.innerHTML = `
                <div class="${data.texClass} w-full h-full relative overflow-hidden" style="background-color: ${data.coverColor}; border-radius: 2px 6px 6px 2px; box-shadow: 15px 15px 30px rgba(0,0,0,0.3);">
                    <div class="absolute inset-0 flex flex-col justify-center items-center">
                        <div class="cover-big-title text-center w-full">${data.short}</div>
                        <div class="absolute bottom-6 right-6 click-hint text-white/70 text-xs tracking-widest uppercase font-serif">Click to Read →</div>
                    </div>
                </div>
            `;
            
            rootStyle.setProperty('--bg-color', data.themeColor);
            viewDetail.classList.remove('is-open'); 
            
            viewShelf.classList.replace('view-active', 'view-hidden');
            setTimeout(() => { viewDetail.classList.replace('view-hidden', 'view-active'); }, 400);
        }

        function generateHeroSection(data) {
            return `
                <div class="w-full min-h-[70vh] md:min-h-[85vh] bg-[#0D0D0D] flex items-center justify-center relative overflow-hidden px-8">
                    <img loading="lazy" decoding="async" src="${data.bgImg}" alt="Background" class="hero-bg-img">
                    <div class="hero-overlay"></div>
                    
                    <div class="max-w-4xl w-full flex flex-col items-center text-center hero-content reveal">
                        <h1 class="text-5xl md:text-7xl font-serif font-black mb-4 tracking-wider">${data.title}</h1>
                        <p class="text-xs md:text-sm text-gray-300 tracking-[0.3em] uppercase mb-8 opacity-80">${data.short} PROJECT</p>
                        <p class="text-base md:text-xl font-bold mb-6 tracking-wider opacity-90">${data.sub}</p>
                        <p class="text-sm md:text-base text-gray-300 leading-loose max-w-2xl opacity-80">${data.desc}</p>
                    </div>
                    
                    <div class="absolute bottom-10 left-1/2 transform -translate-x-1/2 flex flex-col items-center opacity-50 animate-bounce hero-content">
                        <span class="text-xs tracking-widest uppercase mb-2">Scroll Down</span>
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
                    </div>
                </div>
            `;
        }

        function openScrollContent() {
            viewDetail.classList.add('is-open');
            
            setTimeout(() => {
                const data = bookData[currentIndex];
                
                if (currentIndex === 0) {
                    pageContainer.innerHTML = `
                        <div class="w-full min-h-[90vh] py-20 flex flex-col items-center justify-center bg-[#E5A96A] relative overflow-hidden">
                            <div class="text-[12rem] md:text-[20rem] font-serif font-bold text-[#A3662A] opacity-20 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none whitespace-nowrap z-0">ABOUT ME</div>
                            
                            <div class="relative z-10 w-full max-w-5xl px-2 md:px-6 flex flex-row items-center justify-center gap-3 md:gap-8 reveal">
                                <div class="w-1/3 transform md:-rotate-3 hover:rotate-0 hover:scale-105 transition-all duration-500 z-10">
                                    <div class="bg-white p-2 pb-6 md:p-3 md:pb-10 shadow-xl border border-gray-100 rounded-sm">
                                        <img loading="lazy" decoding="async" src="33973da6beab4392e93e2edca6dd34bf.jpg" alt="风景照" class="w-full aspect-[3/4] object-cover rounded-sm">
                                    </div>
                                </div>
                                <div class="w-1/3 z-20 transform hover:scale-105 transition-all duration-500">
                                    <div class="bg-white p-2 pb-8 md:p-4 md:pb-12 shadow-2xl border border-gray-100 rounded-sm">
                                        <img loading="lazy" decoding="async" src="cc6c6feb2ed5ddd4f9b3d89278a24f30.jpg" alt="证件照" class="w-full aspect-[3/4] object-cover rounded-sm">
                                    </div>
                                </div>
                                <div class="w-1/3 transform md:rotate-3 hover:rotate-0 hover:scale-105 transition-all duration-500 z-10 delay-100">
                                    <div class="bg-white p-2 pb-6 md:p-3 md:pb-10 shadow-xl border border-gray-100 rounded-sm">
                                        <img loading="lazy" decoding="async" src="d30a334d48491fe5acc278013d6bb293.jpg" alt="生活照" class="w-full aspect-[3/4] object-cover rounded-sm">
                                    </div>
                                </div>
                            </div>

            const observerOptions = {
                root: null, // 以浏览器整个屏幕视口为准
                rootMargin: '50px', // 提前50px开始计算，防卡顿
                threshold: 0.01 // 只要有一丝丝露出立刻触发
            };

            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                        observer.unobserve(entry.target); // 显示后就不再重复计算
                    }
                });
            }, observerOptions);

            const revealElements = document.querySelectorAll('.reveal, .line-grow');
            revealElements.forEach(el => observer.observe(el));

            // 终极安全兜底：如果检测到了死机或网速慢，800毫秒后强制掀开所有图片的“隐身衣”
            setTimeout(() => {
                revealElements.forEach(el => el.classList.add('active'));
            }, 800);
        }

        function handleBackToDetail() {
            rootStyle.setProperty('--bg-color', bookData[currentIndex].themeColor);
            
            const backBtn = document.getElementById('scroll-back-btn');
            backBtn.classList.remove('text-gray-800', 'border-gray-800/30', 'bg-white/80');
            backBtn.classList.add('text-white', 'border-white/30', 'bg-black/40');
            
            viewScroll.classList.replace('view-active', 'view-hidden');
            viewDetail.classList.replace('view-hidden', 'view-active');
            
            setTimeout(() => {
                viewDetail.classList.remove('is-open');
                
                const videos = document.querySelectorAll('.portfolio-video');
                videos.forEach(video => video.pause());
            }, 50);
        }

        function handleBackToShelf() {
            rootStyle.setProperty('--bg-color', '#F4F3ED');
            viewDetail.classList.replace('view-active', 'view-hidden');
            setTimeout(() => { viewShelf.classList.replace('view-hidden', 'view-active'); }, 400);
        }
    </script>
</body>
</html>
